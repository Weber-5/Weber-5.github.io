# Photography.
#
# Put image files in content/photos/ and they appear on the site automatically,
# with camera settings read from EXIF. Add an entry here only to say more:
#
# - file: andromeda.jpg
#   title: { en: Andromeda Galaxy, zh: 仙女座星系 }
#   category: astro            # astro, landscape, city, nature, people, ...
#   date: 2026-08-12
#   location: { en: Mount Wugong, zh: 武功山 }
#   caption: { en: One sentence about the night., zh: 关于这一夜的一句话。 }
#   featured: true             # show on the home page
#   gear: { lens: Samyang 14mm f/2.8 }   # fills or corrects EXIF
#   astro:
#     target: { en: M31, zh: M31 仙女座星系 }
#     telescope: RedCat 51
#     camera: ZWO ASI2600MC
#     mount: Star Adventurer GTi
#     filters: L-eXtreme
#     exposure: 120 × 180 s
#     integration: 6 h
#     bortle: 4
#
# The entries below are placeholders. They disappear by themselves as soon as
# the first real photograph is added, so there is nothing to delete.

- placeholder: true
  kind: milkyway
  aspect: 1.5
  category: astro
  featured: true
  title: { en: Photo title, zh: 照片标题 }
  location: { en: Location, zh: 拍摄地点 }
  astro: { target: { en: Milky Way core, zh: 银河核心 }, exposure: 20 × 15 s, integration: 5 min, bortle: '3' }
